[package]
name = "cuelight-loader"
description = "Load cuelight shows from disk or memory: show folders, PNG images, bitmap fonts, driver scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["multimedia", "animation", "assets", "loader"]
categories = ["multimedia", "rendering"]

[dependencies]
cuelight = { path = "../cuelight", version = "0.0.1", default-features = false }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
usvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"], optional = true }

[features]
default = ["png", "outline-fonts", "svg"]
# Convert .svg files under assets/ into vector artwork (paths with fills
# and strokes; text becomes paths through the system's fonts).
svg = ["dep:usvg"]
# Image decoders. Hosts that decode images themselves (a browser, a game
# engine) can turn them off and register pixels with Engine::set_image.
png = ["dep:png"]
# Register .ttf / .otf files as outline fonts (pulls the font metrics code
# into the engine). Without it such files are reported as skipped.
outline-fonts = ["cuelight/outline-fonts"]
