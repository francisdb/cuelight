name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers (for cpal, examples only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build (all features)
        run: cargo build --workspace --all-features
      - name: Test (all features, includes schema drift check)
        run: cargo test --workspace --all-features
      - name: Test (no default features)
        # without the player: it needs the renderer, and cargo would unify
        # that feature back into cuelight for the whole build
        run: cargo test --workspace --exclude cuelight-player --no-default-features

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers (for cpal, examples only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: clippy (no default features)
        run: cargo clippy --workspace --exclude cuelight-player --all-targets --no-default-features -- -D warnings
      - name: docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings